name: ci

on:
  push:
  pull_request:

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    env:
      # Add a GOOGLE_API_KEY repository secret to enable the live-model eval step.
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit + end-to-end tests
        run: mvn -B verify

      # Deterministic gate: the baseline model must pass every golden case. If this fails, a code
      # change broke tools, orchestration, parsing or scoring - not model quality.
      - name: Eval gate (baseline model, offline)
        run: java -jar target/incident-triage-agent.jar eval --model baseline --min-pass-rate 1.0 --out target/eval-baseline.json

      # Quality gate against a real model. Thresholds are lower because LLMs are not
      # deterministic; track the trend in the uploaded reports.
      - name: Eval (Gemini)
        if: env.GOOGLE_API_KEY != ''
        run: java -jar target/incident-triage-agent.jar eval --model gemini-3.5-flash-lite --lead-model gemini-3.8-flash --min-pass-rate 0.8 --out target/eval-gemini.json

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: target/eval-*.json
